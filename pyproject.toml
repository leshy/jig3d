[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "jig3d"
dynamic = ["version"]
description = "Agent-native procedural 3D solid & SubD modelling library and visual workshop for deterministic glTF 2.0 (.glb) meshes"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["3d", "cad", "csg", "subd", "gltf", "glb", "procedural-modeling", "pbr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0",
    "pillow>=10.0",
]

[project.urls]
Repository = "https://github.com/leshy/jig3d"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
jig = "jig.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/jig"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/examples",
    "/tests",
    "/README.md",
    "/SURFACE.md",
    "/AGENTS.md",
    "/LICENSE",
    "/.claude/skills/jig/SKILL.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120
